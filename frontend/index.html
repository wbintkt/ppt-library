<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPT 素材智能检索系统</title>
  <script>
    // 首帧前应用已保存的主题，避免闪色
    (function () {
      try {
        if (localStorage.getItem('ppt_theme') === 'green') {
          document.documentElement.setAttribute('data-theme', 'green')
        }
      } catch (e) {}
    })()
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
